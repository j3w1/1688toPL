name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.route.outputs.category }}
      docs: ${{ steps.route.outputs.docs }}
      code: ${{ steps.route.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify routing rules
        run: node scripts/check-ci-browser.mjs && node --test tests/classify-changes.test.mjs
      - name: Classify complete diff
        id: route
        run: node scripts/classify-changes.mjs

  docs:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check:docs

  code:
    name: Source, unit tests and build
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The image includes the browsers and system libraries for real-canvas units.
      - name: Verify source, documentation, regression tests and complete build
        run: npm run check && npm run check:docs && npm test && npm run build

  browser:
    name: Chromium (${{ matrix.shard }}/4)
    # Each shard builds its own extension, so it need not wait for the code job.
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test the complete extension in Chromium
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4

  required:
    name: required
    needs: [classify, docs, code, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every routed check to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_EXPECTED: ${{ needs.classify.outputs.docs }}
          CODE_EXPECTED: ${{ needs.classify.outputs.code }}
          BROWSER_EXPECTED: ${{ needs.classify.outputs.code }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CODE_RESULT: ${{ needs.code.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const env = process.env;
          assert.equal(env.CLASSIFY_RESULT, 'success', 'Change classification must succeed');
          assert.ok([env.DOCS_EXPECTED, env.CODE_EXPECTED].includes('true'), 'At least one verification route must run');
          for (const check of ['DOCS', 'CODE', 'BROWSER']) {
            assert.ok(['true', 'false'].includes(env[`${check}_EXPECTED`]), `${check} route must be explicit`);
            const expected = env[`${check}_EXPECTED`] === 'true' ? 'success' : 'skipped';
            assert.equal(env[`${check}_RESULT`], expected, `${check} check did not reach its required result`);
          }
          console.log('Every required check passed.');
          NODE
